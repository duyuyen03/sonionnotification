// 1. Khai báo biến lưu trữ file (đặt ở đầu thẻ <script>)
let currentFile = { Name: "", ContentBytes: "", type: "", fullData: "" };

// 2. Hàm xử lý khi chọn file (Cập nhật lại hàm này)
function handleFile(input) {
    const file = input.files[0];
    if (file) {
        document.getElementById('fileNameDisplay').textContent = "📂 File sẵn sàng: " + file.name;
        const reader = new FileReader();
        reader.onload = function(e) {
            // Tách Base64 để gửi qua Email và giữ bản full để hiển thị Web
            currentFile = {
                Name: file.name,
                ContentBytes: e.target.result.split(',')[1],
                type: file.type,
                fullData: e.target.result 
            };
            
            if (file.type.startsWith('image/')) {
                const preview = document.getElementById('previewImg');
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
        };
        reader.readAsDataURL(file);
    }
}

// 3. Hàm gửi bài (Cập nhật phần payload bên trong hàm publishNotice)
async function publishNotice() {
    const title = document.getElementById('noticeTitle').value.trim();
    const content = document.getElementById('noticeContent').value.trim();
    const status = document.getElementById('sendStatus');
    const btn = document.getElementById('sendBtn');

    if (!title || !content) return alert("Vui lòng điền đủ thông tin");

    btn.disabled = true;
    status.style.display = 'block';
    status.textContent = "⏳ Đang gửi...";

    // ĐÂY LÀ PHẦN QUAN TRỌNG NHẤT: Khớp với Schema và Outlook
    const payload = {
        title: title,
        content: content,
        date: new Date().toLocaleString('vi-VN'),
        attachments: currentFile.ContentBytes ? [{
            Name: currentFile.Name,
            ContentBytes: currentFile.ContentBytes
        }] : []
    };

    try {
        if (WEBHOOK_URL) {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        }

        // Phần lưu LocalStorage để hiển thị lên bảng tin (giữ logic cũ của bạn)
        state.notices.push({
            ...payload, 
            filePreview: currentFile.fullData, 
            fileName: currentFile.Name
        });
        localStorage.setItem('intranet_v3', JSON.stringify(state));
        
        status.textContent = "✅ Thành công!";
        setTimeout(() => {
            clearForm();
            showPage('public');
            status.style.display = 'none';
            btn.disabled = false;
            renderPublic(); // Cập nhật lại danh sách bài đăng
        }, 2000);
    } catch(e) {
        alert("Lỗi: " + e.message);
        btn.disabled = false;
    }
}
