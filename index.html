<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thông Báo Nội Bộ</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --accent2: #f5a623;
    --surface: #ffffff;
    --surface2: #f8f7f4;
    --border: #e8e6e0;
    --text: #1a1a2e;
    --text-muted: #888880;
    --success: #2ecc71;
    --danger: #e74c3c;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(26,26,46,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--surface2); color: var(--text); min-height: 100vh; }
  
  /* HEADER */
  .site-header {
  background: var(--primary);
  color: #fff;
  padding: 10px 1rem;
  display: flex;
  flex-wrap: wrap; /* Cho phép các phần tử tự xuống dòng khi hết chỗ */
  align-items: center;
  justify-content: space-between;
  min-height: 64px; /* Dùng min-height thay vì height cố định */
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 10px;
}
  .company-logo {
  height: 30px; /* Giảm một chút để vừa màn hình nhỏ */
  width: auto;
  margin-right: 10px;
}
  .site-logo {
  font-family: 'Playfair Display', serif;
  font-size: 18px; /* Giảm nhẹ size chữ trên mobile */
  display: flex;
  align-items: center;
  flex-shrink: 0; /* Không cho logo bị bóp nhỏ */
}
  .header-nav {
  display: flex;
  gap: 5px;
  align-items: center;
  flex-wrap: nowrap; /* Giữ các nút trên cùng một hàng */
}

/* Điều chỉnh riêng cho màn hình điện thoại cực nhỏ */
@media (max-width: 480px) {
  .logo-text {
    display: none; /* Ẩn chữ "Thông Báo Nội Bộ" trên điện thoại để dành chỗ cho nút */
  }
  .nav-tab {
    padding: 6px 10px;
    font-size: 12px;
  }
}
  .nav-tab.active, .nav-tab:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .nav-tab.accent-tab { background: var(--accent); color: #fff; }
  .logout-btn { background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.7); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-left: 10px; }

  /* PAGES */
  .page { display: none; padding: 2rem; max-width: 960px; margin: 0 auto; }
  .page.active { display: block; }
  
  /* PUBLIC */
  .page-title { font-family: 'Playfair Display', serif; font-size: 32px; margin-bottom: 4px; color: var(--primary); }
  .page-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 2rem; }
  .notice-grid { display: grid; gap: 16px; }
  .notice-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.5rem; box-shadow: var(--shadow); }
  .notice-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
  .notice-body { font-size: 14px; color: #444; line-height: 1.7; }
  .notice-attachment { margin-top: 15px; padding-top: 12px; border-top: 1px dashed var(--border); display: flex; flex-wrap: wrap; gap: 10px; }
  .notice-attachment img { max-width: 100%; height: auto; max-height: 400px; border-radius: 8px; border: 1px solid #eee; cursor: zoom-in; }
  .notice-footer { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--text-muted); margin-top: 15px; }

  /* ADMIN PANEL */
  .panel { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 20px; }
  label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
  input[type=text], input[type=password], textarea {
    width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
    font-family: inherit; font-size: 14px; background: var(--surface2); margin-bottom: 16px; outline: none;
  }
  .attach-zone { background: #fcfcfc; border: 2px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 16px; }
  #previewImgContainer { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
  .preview-thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  .send-btn { width: 100%; padding: 14px; font-size: 15px; border-radius: 10px; background: var(--primary); color: #fff; border: none; cursor: pointer; font-weight: 600; }
  .send-btn:disabled { opacity: 0.5; }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-logo">
    <img src="https://raw.githubusercontent.com/duyuyen03/sonionnotification/main/Logo%20sonion.png" alt="Sonion" class="company-logo">
    <span class="logo-text">Thông Báo Nội Bộ</span>
  </div>
  <div class="header-nav" id="headerNav">
    <button class="nav-tab active" id="tab-public" onclick="showPage('public')">📢 Thông báo</button>
    <button class="nav-tab accent-tab" id="tab-login" onclick="showPage('login')">🔐 Admin</button>
  </div>
</header>

<div class="page active" id="page-public">
  <h1 class="page-title">Thông báo</h1>
  <p class="page-subtitle" id="publicSubtitle">Đang tải...</p>
  <div class="notice-grid" id="noticeGrid"></div>
</div>

<div class="page" id="page-login">
  <div class="panel" style="max-width: 400px; margin: 40px auto;">
    <h2 style="margin-bottom:20px">Quản trị viên</h2>
    <label>User</label>
    <input type="text" id="loginUser" placeholder="">
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="">
    <p id="loginErr" style="color:var(--danger); font-size:13px; margin-bottom:10px; display:none">❌ Sai tài khoản hoặc mật khẩu</p>
    <button class="send-btn" onclick="doLogin()">Đăng nhập</button>
  </div>
</div>

<div class="page" id="page-admin">
  <h1 class="page-title">Bảng điều khiển</h1>
  <div class="panel">
    <label>Tiêu đề thông báo</label>
    <input type="text" id="noticeTitle" placeholder="VD: Thông báo lịch trực tết...">
    <label>Nội dung</label>
    <textarea id="noticeContent" style="min-height:120px; width:100%; border-radius:8px; border:1px solid var(--border); padding:10px;" placeholder="Nhập nội dung..."></textarea>
    <label>Đính kèm tài liệu</label>
    <div class="attach-zone">
      <input type="file" id="noticeFile" style="display:none" multiple onchange="handleFile(this)">
      <button type="button" onclick="document.getElementById('noticeFile').click()">Chọn tệp</button>
      <p id="fileNameDisplay" style="font-size:12px; color:#888; margin-top:8px">Chưa có tệp nào</p>
      <div id="previewImgContainer"></div>
    </div>
    <button class="send-btn" id="sendBtn" onclick="publishNotice()">Đăng & Gửi Power Automate</button>
    <div id="sendStatus" style="margin-top:10px; font-size:13px; display:none"></div>
  </div>
  <div class="panel">
    <h3>Lịch sử thông báo</h3>
    <div id="adminNoticeList" style="margin-top:15px"></div>
  </div>
</div>

<script>
// --- CẤU HÌNH ---
const WEBHOOK_URL = 'https://defaultaf1f375339254e6f949b97c0073208.03.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/9f15bac38c2640b185716127e7c0ff44/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Bxa82ctx9WzqmiTinfUvl5OuwFHkDyX-LhfbnPq70bs';
const DB_URL = 'https://script.google.com/macros/s/AKfycbyUFNsqk90ZwagUzns3sS6M--0Ald53QZ2trAENFR1IOxOxRQWQSzfKDfI5Q2u6RguEqg/exec'; 

let state = { notices: [], currentUser: "" };
let selectedFiles = [];

async function init() {
    try {
        const response = await fetch(DB_URL);
        state.notices = await response.json();
        renderPublic();
    } catch(e) { 
        document.getElementById('publicSubtitle').textContent = "Lỗi kết nối máy chủ.";
    }
}

function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('page-' + pageId).classList.add('active');
    const tab = document.getElementById('tab-' + pageId);
    if(tab) tab.classList.add('active');
    if (pageId === 'public') renderPublic();
    if (pageId === 'admin') renderAdminNotices();
}

async function doLogin() {
    const u = document.getElementById('loginUser').value;
    const p = document.getElementById('loginPass').value;
    const err = document.getElementById('loginErr');

    try {
        const response = await fetch(DB_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "check_login", username: u, password: p })
        });
        const result = await response.json();

        if (result.success) {
            err.style.display = 'none';
            state.currentUser = result.team;
            const adminBtn = document.getElementById('tab-login');
            adminBtn.innerHTML = "⚙️ Quản lý";
            adminBtn.onclick = () => showPage('admin');
            
            if (!document.getElementById('logoutBtn')) {
                const logoutBtn = document.createElement('button');
                logoutBtn.className = 'logout-btn';
                logoutBtn.id = 'logoutBtn';
                logoutBtn.textContent = 'Thoát';
                logoutBtn.onclick = () => location.reload();
                document.getElementById('headerNav').appendChild(logoutBtn);
            }
            showPage('admin');
            alert("Xin chào " + result.team);
        } else {
            err.style.display = 'block';
        }
    } catch(e) { alert("Lỗi đăng nhập!"); }
}

async function handleFile(input) {
    const files = Array.from(input.files);
    const container = document.getElementById('previewImgContainer');
    container.innerHTML = "";
    selectedFiles = await Promise.all(files.map(file => {
        return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = e => resolve({
                Name: file.name,
                ContentBytes: e.target.result.split(',')[1],
                type: file.type,
                fullData: e.target.result
            });
            reader.readAsDataURL(file);
        });
    }));
    selectedFiles.forEach(f => {
        if (f.type.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = f.fullData;
            img.className = 'preview-thumb';
            container.appendChild(img);
        }
    });
    document.getElementById('fileNameDisplay').textContent = `Đã chọn ${files.length} tệp`;
}

async function publishNotice() {
    const title = document.getElementById('noticeTitle').value;
    const content = document.getElementById('noticeContent').value;
    const btn = document.getElementById('sendBtn');
    
    if(!title || !content) return alert("Vui lòng nhập đủ thông tin!");
    
    btn.disabled = true;
    const payload = {
        title: title,
        content: `[Team: ${state.currentUser}] \n` + content,
        date: new Date().toLocaleString('vi-VN'),
        files: selectedFiles.map(f => ({ name: f.Name, data: f.fullData }))
    };

    try {
        await fetch(DB_URL, { method: 'POST', body: JSON.stringify(payload) });
        if(WEBHOOK_URL) {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: payload.title,
                    content: payload.content,
                    date: payload.date,
                    attachments: selectedFiles.map(f => ({ Name: f.Name, ContentBytes: f.ContentBytes }))
                })
            });
        }
        state.notices.push(payload);
        alert("Đăng thành công!");
        location.reload();
    } catch(e) { alert("Lỗi gửi tin!"); btn.disabled = false; }
}

function renderPublic() {
    const grid = document.getElementById('noticeGrid');
    document.getElementById('publicSubtitle').textContent = state.notices.length + " thông báo";
    
    if (state.notices.length === 0) {
        grid.innerHTML = '<p style="text-align:center; padding:40px; color:#999">Chưa có thông báo nào.</p>';
        return;
    }

    grid.innerHTML = state.notices.slice().reverse().map(n => {
        // Logic xử lý phần đính kèm
        let attachmentsHTML = "";
        if (n.files && n.files.length > 0) {
            attachmentsHTML = '<div class="notice-attachment">';
            n.files.forEach(f => {
                // Kiểm tra nếu là ảnh thì hiển thị ảnh, nếu là tệp khác thì hiện link tải
                if (f.data && f.data.startsWith('data:image/')) {
                    attachmentsHTML += `<img src="${f.data}" onclick="openFullImage('${f.data}')" style="max-width:100%; cursor:pointer; border-radius:8px; margin-top:10px;" title="Nhấp để xem ảnh lớn">`;
                } else if (f.data) {
                    attachmentsHTML += `<a href="${f.data}" download="${f.name}" style="color:var(--accent); text-decoration:none; font-size:12px; font-weight:600; border:1px solid #eee; padding:5px 10px; border-radius:4px; display:inline-block; margin-right:5px;">📎 ${f.name}</a>`;
                }
            });
            attachmentsHTML += '</div>';
        }

        return `
            <div class="notice-card">
                <div class="notice-title">${n.title}</div>
                <div class="notice-body">${n.content.replace(/\n/g, '<br>')}</div>
                ${attachmentsHTML}
                <div class="notice-footer">📅 ${n.date}</div>
            </div>
        `;
    }).join('');
}

// Thêm hàm này để khi nhấn vào ảnh nó sẽ mở to ra ở tab mới
function openFullImage(base64Data) {
    const win = window.open();
    win.document.write(`<body style="margin:0; background:#111; display:flex; align-items:center; justify-content:center;"><img src="${base64Data}" style="max-width:100%; max-height:100vh; cursor:zoom-out" onclick="window.close()"></body>`);
}

function renderAdminNotices() {
    const list = document.getElementById('adminNoticeList');
    
    if (state.notices.length === 0) {
        list.innerHTML = '<p style="text-align:center; padding:20px; color:#999">Chưa có lịch sử thông báo.</p>';
        return;
    }

    list.innerHTML = state.notices.slice().reverse().map((n, i) => {
        const actualIndex = state.notices.length - 1 - i;
        
        let attachmentsHTML = "";
        if (n.files && n.files.length > 0) {
            attachmentsHTML = '<div class="notice-attachment" style="margin-top:10px; border-top: 1px dashed #eee; padding-top:10px;">';
            n.files.forEach(f => {
                if (f.data && f.data.startsWith('data:image/')) {
                    // Đã thêm onclick="openFullImage()" và cursor:pointer bên dưới
                    attachmentsHTML += `<img src="${f.data}" 
                                         onclick="openFullImage('${f.data}')" 
                                         style="height:60px; width:60px; object-fit:cover; border-radius:4px; margin-right:8px; border:1px solid #ddd; cursor:pointer;" 
                                         title="Xem ảnh lớn">`;
                } else if (f.data) {
                    attachmentsHTML += `<a href="${f.data}" download="${f.name}" style="font-size:11px; color:#666; background:#f0f0f0; padding:2px 6px; border-radius:4px; margin-right:5px; text-decoration:none;">📎 ${f.name.substring(0,10)}...</a>`;
                }
            });
            attachmentsHTML += '</div>';
        }

        return `
            <div class="notice-card" style="margin-bottom:15px; position:relative; padding: 1rem; border: 1px solid var(--border); border-radius: 8px; background: #fff;">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
                    <div class="notice-title" style="font-size:16px; font-weight:700; color:var(--primary);">${n.title}</div>
                    <button onclick="deleteNotice(${actualIndex})" style="color:var(--danger); background:none; border:1px solid var(--danger); padding:2px 8px; border-radius:4px; cursor:pointer; font-size:12px; font-weight:600;">Xóa</button>
                </div>
                <div class="notice-body" style="font-size:13px; color:#444; line-height:1.5;">${n.content.replace(/\n/g, '<br>')}</div>
                ${attachmentsHTML}
                <div class="notice-footer" style="margin-top:12px; font-size:11px; color:#888;">📅 ${n.date}</div>
            </div>
        `;
    }).join('');
}

async function deleteNotice(index) {
    if(!confirm("Xóa thông báo này?")) return;
    try {
        await fetch(DB_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "delete", title: state.notices[index].title })
        });
        state.notices.splice(index, 1);
        renderAdminNotices();
    } catch(e) { alert("Lỗi xóa!"); }
}

init();
</script>
</body>
</html>
