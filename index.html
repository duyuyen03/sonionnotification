<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thông Báo Nội Bộ</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --accent2: #f5a623;
    --surface: #ffffff;
    --surface2: #f8f7f4;
    --border: #e8e6e0;
    --text: #1a1a2e;
    --text-muted: #888880;
    --success: #2ecc71;
    --danger: #e74c3c;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(26,26,46,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--surface2); color: var(--text); min-height: 100vh; }

  /* HEADER */
  .site-header {
    background: var(--primary); color: #fff;
    padding: 0 2rem; display: flex; align-items: center; justify-content: space-between;
    height: 64px; position: sticky; top: 0; z-index: 100;
  }
  .site-logo { font-family: 'Playfair Display', serif; font-size: 20px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .header-nav { display: flex; gap: 8px; align-items: center; }
  .nav-tab { padding: 6px 16px; border-radius: 20px; border: none; cursor: pointer; font-family: 'Be Vietnam Pro', sans-serif; font-size: 13px; font-weight: 500; transition: all 0.2s; background: transparent; color: rgba(255,255,255,0.6); }
  .nav-tab.active, .nav-tab:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .nav-tab.accent-tab { background: var(--accent); color: #fff; }
  .logout-btn { background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.7); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-family: 'Be Vietnam Pro', sans-serif; font-size: 13px; transition: all 0.2s; }
  .logout-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

  /* PAGES */
  .page { display: none; padding: 2rem; max-width: 960px; margin: 0 auto; }
  .page.active { display: block; }

  /* PUBLIC */
  .page-title { font-family: 'Playfair Display', serif; font-size: 32px; margin-bottom: 4px; color: var(--primary); }
  .page-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 2rem; }
  .notice-grid { display: grid; gap: 16px; }
  .notice-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.5rem; box-shadow: var(--shadow); animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .notice-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
  .notice-body { font-size: 14px; color: #444; line-height: 1.7; margin-bottom: 12px; }
  .notice-attachment { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .notice-footer { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--text-muted); }

  /* ADMIN & FORMS */
  .panel { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 20px; }
  .panel-title { font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px; }
  label { font-size: 13px; font-weight: 500; color: var(--text); display: block; margin-bottom: 6px; }
  input[type=text], input[type=password], textarea {
    width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
    font-family: 'Be Vietnam Pro', sans-serif; font-size: 14px; background: var(--surface2); outline: none; margin-bottom: 16px;
  }
  textarea { min-height: 120px; }
  
  /* ATTACHMENT BOX */
  .attach-zone { background: #fcfcfc; border: 2px dashed var(--border); border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 16px; transition: all 0.2s; }
  .attach-zone:hover { border-color: var(--accent); background: #fff5f6; }
  #previewImg { max-width: 100%; max-height: 150px; border-radius: 6px; margin-top: 10px; display: none; margin-left: auto; margin-right: auto; }
  .file-info { font-size: 12px; color: var(--text-muted); margin-top: 5px; display: block; }

  .send-btn {
    width: 100%; padding: 14px; font-size: 15px; border-radius: 10px;
    background: var(--primary); color: #fff; border: none; cursor: pointer;
    font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-bar { padding: 12px; border-radius: 8px; font-size: 13px; margin-top: 12px; display: none; }
  .status-bar.success { background: #eafaf1; color: #1e8449; display: block; }
  .status-bar.error { background: #fde8e8; color: #c0392b; display: block; }

  /* LOGIN */
  .login-wrap { min-height: calc(100vh - 150px); display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--surface); border-radius: 20px; padding: 2.5rem; border: 1px solid var(--border); box-shadow: var(--shadow); width: 100%; max-width: 400px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-logo"><span class="logo-dot"></span>Thông Báo Nội Bộ</div>
  <div class="header-nav" id="headerNav">
    <button class="nav-tab active" onclick="showPage('public')">📢 Thông báo</button>
    <button class="nav-tab accent-tab" id="adminLoginBtn">🔐 Admin</button>
  </div>
</header>

<!-- TRANG CHỦ (PUBLIC) -->
<div class="page active" id="page-public">
  <h1 class="page-title">Thông báo</h1>
  <p class="page-subtitle" id="publicSubtitle">Đang tải...</p>
  <div class="notice-grid" id="noticeGrid"></div>
</div>

<!-- ĐĂNG NHẬP -->
<div class="page" id="page-login">
  <div class="login-wrap">
    <div class="login-card">
      <h2 style="margin-bottom:8px">Đăng nhập Admin</h2>
      <label>Tên đăng nhập</label>
      <input type="text" id="loginUser" placeholder="admin">
      <label>Mật khẩu</label>
      <input type="password" id="loginPass" placeholder="••••••••">
      <div id="loginErr" style="color:var(--danger); font-size:13px; margin-bottom:10px; display:none">❌ Thông tin không chính xác</div>
      <button class="send-btn" onclick="doLogin()">Đăng nhập</button>
    </div>
  </div>
</div>

<!-- QUẢN TRỊ (ADMIN) -->
<div class="page" id="page-admin">
  <h1 class="page-title">Bảng điều khiển</h1>
  <div class="panel">
    <div class="panel-title">✍️ Soạn thông báo mới</div>
    
    <label>Tiêu đề</label>
    <input type="text" id="noticeTitle" placeholder="VD: Thông báo nghỉ lễ...">
    
    <label>Nội dung chi tiết</label>
    <textarea id="noticeContent" placeholder="Nhập nội dung..."></textarea>

    <label>Đính kèm (Ảnh hoặc Tài liệu)</label>
    <div class="attach-zone">
      <input type="file" id="noticeFile" style="display:none" onchange="handleFile(this)">
      <button type="button" onclick="document.getElementById('noticeFile').click()" style="background:#eee; border:1px solid #ccc; padding:5px 12px; border-radius:4px; cursor:pointer; font-size:13px">Chọn tập tin</button>
      <span id="fileNameDisplay" class="file-info">Chưa có tệp nào được chọn</span>
      <img id="previewImg" src="">
    </div>

    <button class="send-btn" id="sendBtn" onclick="publishNotice()">
      <span id="sendText">Đăng & Gửi qua Power Automate</span>
    </button>
    <div class="status-bar" id="sendStatus"></div>
  </div>

  <div class="panel">
    <div class="panel-title">📋 Lịch sử đã đăng</div>
    <div id="adminNoticeList" style="font-size:14px"></div>
  </div>
</div>

<script>
const ADMIN_USER = 'admin';
const ADMIN_PASS = 'admin123';
const WEBHOOK_URL = ''; // Dán URL Power Automate của bạn vào đây

let state = { notices: [] };
let currentFileData = null;
let currentFileName = "";

function load() { 
    try { 
        const s = localStorage.getItem('intranet_v3'); 
        if (s) state = JSON.parse(s); 
    } catch(e) {} 
}
function save() { localStorage.setItem('intranet_v3', JSON.stringify(state)); }

function showPage(p) {
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    document.getElementById('page-' + p).classList.add('active');
    if (p === 'public') renderPublic();
    if (p === 'admin') renderAdminNotices();
}

// Xử lý File
function handleFile(input) {
    const file = input.files[0];
    const display = document.getElementById('fileNameDisplay');
    const preview = document.getElementById('previewImg');
    
    if (file) {
        currentFileName = file.name;
        display.textContent = "Đã chọn: " + file.name;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            currentFileData = e.target.result;
            if (file.type.startsWith('image/')) {
                preview.src = currentFileData;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
        };
        reader.readAsDataURL(file);
    }
}

// Auth
function doLogin() {
    const u = document.getElementById('loginUser').value;
    const p = document.getElementById('loginPass').value;
    if (u === ADMIN_USER && p === ADMIN_PASS) {
        document.getElementById('adminLoginBtn').textContent = '⚙️ Admin';
        document.getElementById('adminLoginBtn').onclick = () => showPage('admin');
        showPage('admin');
    } else {
        document.getElementById('loginErr').style.display = 'block';
    }
}

// Render Public
function renderPublic() {
    const grid = document.getElementById('noticeGrid');
    document.getElementById('publicSubtitle').textContent = state.notices.length + ' thông báo đang hiển thị';
    
    if (!state.notices.length) {
        grid.innerHTML = '<div style="text-align:center; padding:50px; color:#888">Chưa có thông báo nào.</div>';
        return;
    }

    grid.innerHTML = state.notices.slice().reverse().map(n => {
        let attachHtml = "";
        if (n.fileData) {
            if (n.fileData.startsWith('data:image/')) {
                attachHtml = `<div class="notice-attachment"><img src="${n.fileData}" style="max-width:100%; border-radius:8px;"></div>`;
            } else {
                attachHtml = `<div class="notice-attachment"><a href="${n.fileData}" download="${n.fileName}" style="color:var(--accent); text-decoration:none; font-weight:500">📎 Tải tệp đính kèm: ${n.fileName}</a></div>`;
            }
        }

        return `
        <div class="notice-card">
            <div class="notice-title">${esc(n.title)}</div>
            <div class="notice-body">${esc(n.content).replace(/\n/g,'<br>')}</div>
            ${attachHtml}
            <div class="notice-footer"><span>📅 ${n.date}</span></div>
        </div>`;
    }).join('');
}

// Render Lịch sử Admin
function renderAdminNotices() {
    const list = document.getElementById('adminNoticeList');
    if (!state.notices.length) {
        list.innerHTML = 'Chưa có thông báo.';
        return;
    }
    list.innerHTML = state.notices.slice().reverse().map((n, i) => `
        <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee">
            <div>
                <strong>${esc(n.title)}</strong><br>
                <small style="color:#888">${n.date}</small>
            </div>
            <button onclick="deleteNotice(${state.notices.length - 1 - i})" style="border:none; background:none; color:red; cursor:pointer">Xoá</button>
        </div>
    `).join('');
}

function deleteNotice(i) {
    if(confirm('Xoá thông báo này?')) {
        state.notices.splice(i, 1);
        save();
        renderAdminNotices();
    }
}

// Đăng bài
async function publishNotice() {
    const title = document.getElementById('noticeTitle').value.trim();
    const content = document.getElementById('noticeContent').value.trim();
    const btn = document.getElementById('sendBtn');
    
    if (!title || !content) {
        alert('Vui lòng nhập tiêu đề và nội dung');
        return;
    }

    btn.disabled = true;
    document.getElementById('sendText').textContent = 'Đang xử lý...';

    const date = new Date().toLocaleString('vi-VN');
    const payload = { 
        title, 
        content, 
        date, 
        fileName: currentFileName, 
        fileData: currentFileData 
    };

    try {
        if (WEBHOOK_URL) {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        }
        
        state.notices.push(payload);
        save();
        alert('Đã đăng thông báo thành công!');
        clearForm();
        showPage('public');
    } catch (e) {
        alert('Lỗi khi gửi Power Automate: ' + e.message);
    } finally {
        btn.disabled = false;
        document.getElementById('sendText').textContent = 'Đăng & Gửi qua Power Automate';
    }
}

function clearForm() {
    document.getElementById('noticeTitle').value = '';
    document.getElementById('noticeContent').value = '';
    document.getElementById('noticeFile').value = '';
    document.getElementById('fileNameDisplay').textContent = 'Chưa có tệp nào được chọn';
    document.getElementById('previewImg').style.display = 'none';
    currentFileData = null;
    currentFileName = "";
}

function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

load();
renderPublic();
</script>

</body>
</html>
